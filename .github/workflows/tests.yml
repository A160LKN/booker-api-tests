name: API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # каждый день в 03:00 UTC (08:00 по Астане)
  workflow_dispatch:       # кнопка «Run workflow» для ручного запуска

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Скачать код
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      # Restful Booker — чужой бесплатный стенд: он засыпает и иногда отвечает 502/503.
      # Повторяем только такие падения (сеть, таймаут, 5xx от стенда) — до двух раз с паузой.
      # Ошибка в логике API или в тесте не повторяется и роняет прогон сразу; повторы видны в отчёте
      - name: Запустить тесты
        run: >-
          pytest --reruns 2 --reruns-delay 10
          --only-rerun "requests.exceptions" --only-rerun "ConnectionError" --only-rerun "Timeout"
          --only-rerun "assert 50[0234] =="

      - name: Собрать Allure-отчёт
        if: always()   # отчёт нужен и тогда, когда тесты упали
        run: npx --yes allure-commandline@2 generate allure-results --clean -o allure-report

      - name: Подготовить отчёт к публикации
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  postman:
    name: Коллекция Postman (Newman)
    runs-on: ubuntu-24.04
    steps:
      - name: Скачать код
        uses: actions/checkout@v7

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Запустить коллекцию
        run: npx --yes newman@6 run postman/booker.postman_collection.json

  report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Опубликовать отчёт на GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
